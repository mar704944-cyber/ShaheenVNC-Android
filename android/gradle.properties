# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check the file directly to understand the defaults.

# When configured, Gradle will run in offline mode.
# org.gradle.offline=true

# Android project settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m

# Kotlin
kotlin.code.style=official

# Build features
android.useAndroidX=true
android.enableJetifier=true

# R8/ProGuard
android.enableR8=true
android.enableNewResourceShrinker=true

# Gradle stability
gradle.startup=quiet

# Development environment
android.builder.parallel=true
